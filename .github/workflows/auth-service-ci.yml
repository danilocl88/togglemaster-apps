name: CI - auth-service

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-ci.yml'

permissions:
  contents: read

concurrency:
  group: auth-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quality-security:
    name: Build / Test / Security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'auth-service/go.mod'
          cache: false

      - name: Download dependencies
        working-directory: auth-service
        run: go mod download

      - name: Go test
        working-directory: auth-service
        run: go test ./...

      - name: Go vet
        working-directory: auth-service
        run: go vet ./...

      - name: SAST - gosec
        run: |
          docker run --rm             -v "$PWD:/src"             -w "/src/auth-service"             ghcr.io/securego/gosec:2.28.0             -severity high             -confidence high             ./...

      - name: SCA - govulncheck
        id: govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          work-dir: auth-service
          repo-checkout: false
          go-version-file: auth-service/go.mod
          cache: false
          go-package: ./...
          output-format: json
          output-file: govulncheck.json

      - name: Trivy filesystem - CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: 'auth-service'
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Docker build
        run: |
          docker build             --tag togglemaster/auth-service:${GITHUB_SHA}             auth-service

      - name: Trivy image - CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'togglemaster/auth-service:${{ github.sha }}'
          format: table
          severity: CRITICAL
          exit-code: '1'
