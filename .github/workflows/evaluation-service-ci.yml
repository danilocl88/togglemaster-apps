name: CI - evaluation-service

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-service-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-service-ci.yml'

permissions:
  contents: read

concurrency:
  group: evaluation-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quality-security:
    name: Build / Test / Security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
          cache-dependency-path: evaluation-service/go.sum
      - name: Download dependencies
        working-directory: evaluation-service
        run: go mod download

      - name: Go test
        working-directory: evaluation-service
        run: go test ./...

      - name: Go vet
        working-directory: evaluation-service
        run: go vet ./...

      - name: SAST - gosec
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w "/src/evaluation-service" \
            ghcr.io/securego/gosec:2.28.0 \
            -nosec-require-rules \
            -nosec-require-justification \
            -severity high \
            -confidence high \
            ./...

      - name: SCA - govulncheck
        id: govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: '1.26.x'
          check-latest: true
          cache: false
          work-dir: evaluation-service
          repo-checkout: false
          go-package: ./...
          output-format: json
          output-file: govulncheck.json

      - name: Trivy filesystem - CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: 'evaluation-service'
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Docker build
        run: |
          docker build             --tag togglemaster/evaluation-service:${GITHUB_SHA}             evaluation-service

      - name: Trivy image - CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'togglemaster/evaluation-service:${{ github.sha }}'
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Configure AWS credentials for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Check immutable ECR tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-tag
        env:
          ECR_REPOSITORY: evaluation-service
        run: |
          set -euo pipefail

          set +e
          RESULT="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${GITHUB_SHA}" \
              --region "${{ vars.AWS_REGION }}" \
              2>&1
          )"
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ECR tag ${GITHUB_SHA} already exists; immutable push will be skipped."

          elif echo "$RESULT" | grep -q "ImageNotFoundException"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ECR tag ${GITHUB_SHA} does not exist yet."

          else
            echo "Unable to query ECR repository." >&2
            echo "$RESULT" >&2
            exit "$RC"
          fi

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ecr-tag.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: evaluation-service
        run: |
          set -euo pipefail

          LOCAL_IMAGE="togglemaster/evaluation-service:${GITHUB_SHA}"
          REMOTE_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker image inspect "$LOCAL_IMAGE" >/dev/null

          docker tag \
            "$LOCAL_IMAGE" \
            "$REMOTE_IMAGE"

          docker push "$REMOTE_IMAGE"

      - name: Verify Amazon ECR image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: evaluation-service
        run: |
          set -euo pipefail

          DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${GITHUB_SHA}" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "ECR image digest nao encontrado." >&2
            exit 1
          fi

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "ECR image verified:"
          echo "  Repository : ${ECR_REPOSITORY}"
          echo "  Tag        : ${GITHUB_SHA}"
          echo "  Digest     : ${DIGEST}"

          {
            echo "### ECR image"
            echo
            echo "- Repository: \`${ECR_REPOSITORY}\`"
            echo "- Tag: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- URI: \`${IMAGE_URI}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  gitops:
    name: Update GitOps
    needs: quality-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: togglemaster-gitops-main
      cancel-in-progress: false
      queue: max

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SERVICE_NAME: evaluation-service
      GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          ref: ${{ vars.GITOPS_BRANCH }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: true
          fetch-depth: 0

      - name: Update immutable image tag
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="apps/${SERVICE_NAME}-deployment.yaml"

          if [ ! -f "$MANIFEST" ]; then
            echo "GitOps manifest not found: $MANIFEST" >&2
            exit 1
          fi

          python3 - "$MANIFEST" <<'PYTHON'
          from pathlib import Path
          import os
          import re
          import sys

          manifest = Path(sys.argv[1])

          service = os.environ["SERVICE_NAME"]
          account = os.environ["AWS_ACCOUNT_ID"]
          region = os.environ["AWS_REGION"]
          sha = os.environ["GITHUB_SHA"]

          registry = (
              f"{account}.dkr.ecr.{region}.amazonaws.com"
          )

          expected_repository = (
              f"{registry}/{service}"
          )

          text = manifest.read_text()

          pattern = re.compile(
              rf"(?m)^("
              rf"\s*image:\s*"
              rf"{re.escape(expected_repository)}:"
              rf")[0-9a-f]{40}\s*$"
          )

          new_text, count = pattern.subn(
              rf"\g<1>{sha}",
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one image reference for "
                  f"{expected_repository}; replacements={count}"
              )

          manifest.write_text(new_text)

          print(
              f"Updated {service} -> {sha}"
          )
          PYTHON

      - name: Validate GitOps change
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="apps/${SERVICE_NAME}-deployment.yaml"

          EXPECTED_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SERVICE_NAME}:${GITHUB_SHA}"

          if [ ! -f "$MANIFEST" ]; then
            echo "GitOps manifest not found: $MANIFEST" >&2
            exit 1
          fi

          grep -Fq \
            "image: ${EXPECTED_IMAGE}" \
            "$MANIFEST"

          MATCH_COUNT="$(
            grep -Fc \
              "image: ${EXPECTED_IMAGE}" \
              "$MANIFEST"
          )"

          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "Expected one exact image reference; found $MATCH_COUNT" >&2
            exit 1
          fi

          if grep -Eq \
            'image:.*:latest([[:space:]]|$)' \
            "$MANIFEST"
          then
            echo "latest tag is not allowed." >&2
            exit 1
          fi

          git diff --check

          CHANGED="$(
            git diff \
              --name-only
          )"

          if [ -z "$CHANGED" ]; then
            echo "Manifest already references ${GITHUB_SHA}."
            echo "No GitOps diff required."

          elif [ "$CHANGED" = "$MANIFEST" ]; then
            echo "Exactly one GitOps manifest changed."

          else
            echo "Unexpected GitOps changes:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi

          echo "GitOps change validated:"
          echo "  Service : ${SERVICE_NAME}"
          echo "  SHA     : ${GITHUB_SHA}"

      - name: Commit GitOps image update
        id: gitops-commit
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="apps/${SERVICE_NAME}-deployment.yaml"

          git config             user.name             "github-actions[bot]"

          git config             user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST"

          git diff             --cached             --check

          if git diff             --cached             --quiet
          then
            echo "No GitOps change required."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit             -m "chore(gitops): update ${SERVICE_NAME} to ${GITHUB_SHA}"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push GitOps update
        if: steps.gitops-commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for ATTEMPT in 1 2 3 4 5; do

            echo "GitOps push attempt ${ATTEMPT}/5"

            if git push               origin               "HEAD:${GITOPS_BRANCH}"
            then
              echo "GitOps push completed."
              exit 0
            fi

            if [ "$ATTEMPT" -eq 5 ]; then
              echo "Unable to push GitOps update after 5 attempts." >&2
              exit 1
            fi

            echo "Remote changed; rebasing before retry..."

            git fetch               origin               "$GITOPS_BRANCH"

            git rebase               "origin/${GITOPS_BRANCH}"

            sleep "$((ATTEMPT * 2))"

          done

      - name: GitOps summary
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SERVICE_NAME}:${GITHUB_SHA}"

          {
            echo "### GitOps update"
            echo
            echo "- Service: \`${SERVICE_NAME}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Repository: \`${{ vars.GITOPS_REPOSITORY }}\`"
            echo "- Branch: \`${GITOPS_BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"
