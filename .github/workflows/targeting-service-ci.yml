name: CI - targeting-service

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - 'targeting-service/**'
      - '.github/workflows/targeting-service-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'targeting-service/**'
      - '.github/workflows/targeting-service-ci.yml'

permissions:
  contents: read

concurrency:
  group: targeting-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quality-security:
    name: Build / Lint / Security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'targeting-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             -r targeting-service/requirements.txt
          python -m pip install             ruff             bandit             pip-audit

      - name: Python compile
        run: |
          python -m compileall             -q             targeting-service

      - name: Lint - Ruff
        run: |
          ruff check             --select E9,F63,F7,F82             targeting-service

      - name: SAST - Bandit
        run: |
          bandit             -r targeting-service             -lll             -iii

      - name: SCA - pip-audit
        continue-on-error: true
        run: |
          pip-audit             -r targeting-service/requirements.txt

      - name: Trivy filesystem - CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: 'targeting-service'
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Docker build
        run: |
          docker build             --tag togglemaster/targeting-service:${GITHUB_SHA}             targeting-service

      - name: Trivy image - CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'togglemaster/targeting-service:${{ github.sha }}'
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Configure AWS credentials for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Check immutable ECR tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-tag
        env:
          ECR_REPOSITORY: targeting-service
        run: |
          set -euo pipefail

          set +e
          RESULT="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${GITHUB_SHA}" \
              --region "${{ vars.AWS_REGION }}" \
              2>&1
          )"
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ECR tag ${GITHUB_SHA} already exists; immutable push will be skipped."

          elif echo "$RESULT" | grep -q "ImageNotFoundException"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ECR tag ${GITHUB_SHA} does not exist yet."

          else
            echo "Unable to query ECR repository." >&2
            echo "$RESULT" >&2
            exit "$RC"
          fi

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ecr-tag.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: targeting-service
        run: |
          set -euo pipefail

          LOCAL_IMAGE="togglemaster/targeting-service:${GITHUB_SHA}"
          REMOTE_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker image inspect "$LOCAL_IMAGE" >/dev/null

          docker tag \
            "$LOCAL_IMAGE" \
            "$REMOTE_IMAGE"

          docker push "$REMOTE_IMAGE"

      - name: Verify Amazon ECR image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: targeting-service
        run: |
          set -euo pipefail

          DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${GITHUB_SHA}" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "ECR image digest nao encontrado." >&2
            exit 1
          fi

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "ECR image verified:"
          echo "  Repository : ${ECR_REPOSITORY}"
          echo "  Tag        : ${GITHUB_SHA}"
          echo "  Digest     : ${DIGEST}"

          {
            echo "### ECR image"
            echo
            echo "- Repository: \`${ECR_REPOSITORY}\`"
            echo "- Tag: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- URI: \`${IMAGE_URI}\`"
          } >> "$GITHUB_STEP_SUMMARY"
